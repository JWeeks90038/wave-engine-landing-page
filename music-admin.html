<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Music Administration | Wave Engine</title>
    <link rel="icon" type="image/jpeg" href="Images/we_favicon.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="music.css" />
    <script type="module" src="music-admin.js"></script>
  </head>
  <body>
    <div class="page-shell">
      <nav class="topbar site-nav" aria-label="Primary">
        <a class="brand-link" href="./">Wave Engine</a><a href="music">Music</a>
      </nav>
      <main class="content-section">
        <p class="eyebrow">Administrator</p>
        <h1>Music library</h1>
        <p id="admin-status" role="status" aria-live="polite">Loading authentication...</p>
        <form id="admin-login" class="music-admin-form" hidden>
          <label>Email <input type="email" name="email" autocomplete="username" required /></label>
          <label>Password <input type="password" name="password" autocomplete="current-password" required /></label>
          <button class="cta-button cta-primary" type="submit">Sign in</button>
        </form>
        <div id="admin-content" hidden>
          <div class="music-actions">
            <button id="admin-new" class="cta-button" type="button">New track</button>
            <button id="admin-refresh" class="cta-button" type="button">Refresh</button>
            <button id="admin-logout" class="cta-button" type="button">Sign out</button>
          </div>
          <h2 id="editor-title">New track</h2>
          <form id="track-form" class="music-admin-form">
            <label>Song title <input name="title" maxlength="160" required /></label>
            <label>Artist <input name="artist" maxlength="160" required /></label>
            <label>Album or project <input name="album" maxlength="160" /></label>
            <label>Description <textarea name="description" maxlength="5000" rows="4"></textarea></label>
            <label>Genre <input name="genre" maxlength="120" /></label>
            <label>Release date <input name="releaseDate" type="date" /></label>
            <label>Duration (mm:ss) <input name="duration" placeholder="3:45" pattern="[0-9]+:[0-5][0-9]" required /></label>
            <label>Sort order <input name="sortOrder" type="number" step="1" value="0" required /></label>
            <label><span>Published <input name="published" type="checkbox" /></span></label>
            <label>MP3 (audio/mpeg, up to 100 MiB) <input name="mp3" type="file" accept=".mp3,audio/mpeg" /></label>
            <label><span>Remove existing MP3 <input name="removeMp3" type="checkbox" /></span></label>
            <label>WAV (audio/wav or audio/x-wav, up to 100 MiB) <input name="wav" type="file" accept=".wav,audio/wav,audio/x-wav" /></label>
            <label><span>Remove existing WAV <input name="removeWav" type="checkbox" /></span></label>
            <label>Cover artwork (PNG, JPEG or WebP, up to 10 MiB) <input name="cover" type="file" accept="image/png,image/jpeg,image/webp" /></label>
            <label><span>Remove existing cover <input name="removeCover" type="checkbox" /></span></label>
            <button class="cta-button cta-primary" type="submit">Save track</button>
          </form>
          <h2>Tracks</h2>
          <div id="admin-tracks" class="music-admin-list"></div>
        </div>
      </main>
    </div>
  </body>
</html>
